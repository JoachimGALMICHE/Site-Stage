<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon profil — L'Œil d'Euclide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--beige:#F2EDE4;--beige2:#EAE4D8;--violet:#1C1C2E;--violet2:#2A2A3E;--violet-m:#B8956A;--violet-l:#D4B896;--violet-xl:#EDE0CC;--text:#1C1C2E;--text2:#3A3A4E;--text3:#8A8A9A;--line:#D8D0C4;--line2:#C8BEB0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"DM Sans",sans-serif;background:var(--beige);color:var(--text);}
a{color:inherit;text-decoration:none;}
#topbar{background:var(--violet);color:var(--violet-l);padding:6px 40px;font-size:11px;display:flex;justify-content:space-between;align-items:center;position:relative;}
header{padding:32px 40px 0;border-bottom:1px solid var(--line2);}
.site-name{font-family:"Cormorant Garamond",serif;font-size:74px;font-weight:300;letter-spacing:-3px;line-height:1;color:var(--violet);}
.tagline{font-size:11px;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-top:4px;}
nav a{display:inline-block;padding:13px 16px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
nav a:first-child{padding-left:0;}
nav a:hover{color:var(--violet);}
.page-wrap{max-width:760px;margin:0 auto;padding:56px 40px 80px;}
h1{font-family:"Cormorant Garamond",serif;font-size:48px;font-weight:300;color:var(--violet);margin-bottom:32px;}
.profile-card{background:var(--beige2);border:1px solid var(--line);border-radius:4px;padding:32px;margin-bottom:28px;}
.profile-avatar{width:72px;height:72px;border-radius:50%;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-size:28px;font-weight:300;margin-bottom:20px;}
.profile-name{font-family:"Cormorant Garamond",serif;font-size:32px;font-weight:300;color:var(--violet);margin-bottom:4px;}
.profile-role{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--violet-m);margin-bottom:12px;}
.profile-email{font-size:14px;color:var(--text3);}
.form-section{background:var(--beige2);border:1px solid var(--line);border-radius:4px;padding:28px;margin-bottom:20px;}
.form-section h2{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:400;color:var(--violet);margin-bottom:20px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--text2);margin-bottom:6px;}
.form-group input{width:100%;border:1px solid var(--line2);padding:9px 14px;font-family:"DM Sans",sans-serif;font-size:14px;background:var(--beige);color:var(--text);border-radius:2px;outline:none;}
.form-group input:focus{border-color:var(--violet-m);}
.btn-save{background:var(--violet);color:#fff;border:none;padding:10px 24px;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:500;cursor:pointer;border-radius:2px;margin-top:8px;}
.btn-save:hover{background:var(--violet2);}
.toast{position:fixed;bottom:24px;right:24px;background:var(--violet);color:#fff;padding:10px 20px;border-radius:3px;font-size:13px;display:none;z-index:999;}
.toast.show{display:block;}
footer{background:var(--violet);color:var(--violet-l);padding:32px 40px;margin-top:0;}
.f-bottom{display:flex;justify-content:space-between;align-items:center;}
.f-copy{font-size:11px;color:rgba(255,255,255,.25);}
</style>



<script>
window._toggleBurger = function() {
  var m = document.getElementById("burger-menu");
  var b = document.getElementById("burger-btn");
  if (!m) return;
  m.style.display = (m.style.display === "block") ? "none" : "block";
  if (b) b.classList.toggle("open");
};
document.addEventListener("click", function(e) {
  var m = document.getElementById("burger-menu");
  var b = document.getElementById("burger-btn");
  if (m && b && !m.contains(e.target) && !b.contains(e.target)) {
    m.style.display = "none";
    if (b) b.classList.remove("open");
  }
});
window.buildBurger = function(p, auth, signOutFn) {
  var el = document.getElementById("topbar-right");
  if (!el) return;
  var RL = {"super-admin":"Super-administrateur","moderateur-redaction":"Moderateur","redacteur":"Redacteur","moderateur-comments":"Mod.commentaires","lecteur-commentateur":"Lecteur+","lecteur":"Lecteur"};
  var isSA=(p.role==="super-admin"), isMod=isSA||(p.role==="moderateur-redaction"), isW=isMod||(p.role==="redacteur");
  var menu=document.createElement("div"); menu.id="burger-menu";
  menu.style.cssText="display:none;position:absolute;top:100%;right:0;min-width:210px;background:#2A2A3E;border-radius:0 0 6px 6px;box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:9999;padding:6px 0;";
  function row(href,txt){var a=document.createElement("a");a.href=href;a.textContent=txt;a.style.cssText="display:block;padding:9px 20px;color:rgba(255,255,255,.85);text-decoration:none;font-size:13px;";a.onmouseover=function(){this.style.background="rgba(255,255,255,.07)";};a.onmouseout=function(){this.style.background="";};menu.appendChild(a);}
  function sep(){var d=document.createElement("div");d.style.cssText="height:1px;background:rgba(255,255,255,.1);margin:4px 0;";menu.appendChild(d);}
  var h=document.createElement("div");h.style.cssText="padding:9px 20px 3px;font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.1em;";h.textContent=p.prenom+" "+p.nom;menu.appendChild(h);
  var r=document.createElement("div");r.style.cssText="padding:2px 20px 8px;font-size:11px;color:rgba(255,255,255,.4);";r.textContent=RL[p.role]||p.role;menu.appendChild(r);
  sep();row("profil.html","Mon profil");
  if(isW)row("creer-article.html","Creer un article");
  if(isMod){sep();row("moderation.html","Moderation");row("disposition.html","Disposition");}
  if(isSA){sep();row("gestion-comptes.html","Comptes");row("auteurs.html","Auteurs");row("permissions.html","Permissions");}
  sep();
  var dBtn=document.createElement("button");dBtn.textContent="Deconnexion";dBtn.style.cssText="display:block;width:100%;text-align:left;padding:9px 20px;font-size:13px;color:rgba(255,255,255,.85);background:none;border:none;cursor:pointer;font-family:inherit;";
  dBtn.onclick=function(){signOutFn(auth).then(function(){window.location.href="connexion.html";});};
  menu.appendChild(dBtn);
  var bBtn=document.createElement("button");bBtn.id="burger-btn";bBtn.onclick=window._toggleBurger;
  bBtn.style.cssText="background:none;border:none;cursor:pointer;padding:4px 6px;display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle;";
  for(var i=0;i<3;i++){var bar=document.createElement("span");bar.style.cssText="display:block;width:18px;height:1.5px;background:#EDE0CC;border-radius:1px;";bBtn.appendChild(bar);}
  var ns=document.createElement("span");ns.style.cssText="color:rgba(255,255,255,.6);font-size:11px;margin-right:8px;";ns.textContent=p.prenom+" "+p.nom;
  el.innerHTML="";el.appendChild(ns);el.appendChild(bBtn);el.appendChild(menu);
};
</script>
</head>
<body>

<div id="topbar">
  <span id="topbar-date"></span>
  <span id="topbar-right" style="position:relative;"></span>
</div>

<header>
  <div style="display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:18px;">
    <div>
      <a href="index.html" style="display:flex;align-items:center;gap:14px;">
        <svg width="52" height="52" viewBox="0 0 52 52" fill="none"><rect x="4" y="4" width="28" height="28" stroke="#B8956A" stroke-width="0.8" fill="none"/><circle cx="18" cy="18" r="14" stroke="#B8956A" stroke-width="0.8" fill="none"/><line x1="4" y1="18" x2="32" y2="18" stroke="#B8956A" stroke-width="0.5" opacity="0.6"/><line x1="18" y1="4" x2="18" y2="32" stroke="#B8956A" stroke-width="0.5" opacity="0.6"/><line x1="32" y1="32" x2="44" y2="44" stroke="#B8956A" stroke-width="0.8" opacity="0.5"/></svg>
        <div class="site-name">L'Œil d'Euclide</div>
      </a>
      <p class="tagline">Analyses indépendantes rédigées par des experts et des observateurs.</p>
    </div>
  </div>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="categorie.html?cat=Politique">Politique</a>
    <a href="categorie.html?cat=Société">Société</a>
    <a href="categorie.html?cat=Science">Science</a>
    <a href="categorie.html?cat=Environnement">Environnement</a>
  </nav>
</header>

<div class="page-wrap">
  <h1>Mon profil</h1>
  <div id="profile-content" style="color:var(--text3);font-size:14px;">Chargement…</div>
</div>

<footer>
  <div class="f-bottom">
    <span class="f-copy">© 2026 L'Œil d'Euclide</span>
    <span style="font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;color:#B8956A;">Mettre notre monde en perspective</span>
  </div>
</footer>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const _app = getApps().length ? getApps()[0] : initializeApp({
  apiKey:"AIzaSyCm5zSAJWQ6Le3-5Lb7b6DUmnGqYzBk0wk",
  authDomain:"l-oeil-d-euclyde.firebaseapp.com",
  projectId:"l-oeil-d-euclyde",
  storageBucket:"l-oeil-d-euclyde.firebasestorage.app",
  messagingSenderId:"179241004963",
  appId:"1:179241004963:web:c7c7afa926e03032653416"
});
const auth = getAuth(_app), db = getFirestore(_app);
window._db = db; window._auth = auth;

const RL = {"super-admin":"Super-administrateur","moderateur-redaction":"Modérateur de rédaction","redacteur":"Rédacteur","moderateur-comments":"Modérateur commentaires","lecteur-commentateur":"Lecteur-commentateur","lecteur":"Lecteur"};

// Date
var dt = document.getElementById("topbar-date");
if (dt) dt.textContent = new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).replace(/^./,function(c){return c.toUpperCase();});


function toast(msg) {
  var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  setTimeout(function(){t.classList.remove("show");},2500);
}

onAuthStateChanged(auth, async function(user) {
  var el = document.getElementById("topbar-right");
  if (!user) {
    if(el) el.innerHTML = "<a href=\"connexion.html\" style=\"color:#EDE0CC;\">Connexion</a>";
    document.getElementById("profile-content").innerHTML = "<p>Vous devez être <a href=\"connexion.html\" style=\"color:var(--violet-m);\">connecté</a> pour accéder à votre profil.</p>";
    return;
  }
  try {
    var snap = await getDoc(doc(db,"users",user.uid));
    if (!snap.exists()) return;
    var p = snap.data();
    window.buildBurger(p, auth, signOut);

    var initials = ((p.prenom||"?")[0]+(p.nom||"?")[0]).toUpperCase();
    document.getElementById("profile-content").innerHTML =
      "<div class=\"profile-card\">"
        +"<div class=\"profile-avatar\">"+initials+"</div>"
        +"<div class=\"profile-name\">"+p.prenom+" "+p.nom+"</div>"
        +"<div class=\"profile-role\">"+(RL[p.role]||p.role)+"</div>"
        +"<div class=\"profile-email\">"+user.email+"</div>"
      +"</div>"
      +"<div class=\"form-section\">"
        +"<h2>Changer le mot de passe</h2>"
        +"<div class=\"form-group\"><label>Mot de passe actuel</label><input type=\"password\" id=\"pwd-old\" placeholder=\"••••••••\"></div>"
        +"<div class=\"form-group\"><label>Nouveau mot de passe</label><input type=\"password\" id=\"pwd-new\" placeholder=\"••••••••\"></div>"
        +"<div class=\"form-group\"><label>Confirmer le nouveau</label><input type=\"password\" id=\"pwd-confirm\" placeholder=\"••••••••\"></div>"
        +"<button class=\"btn-save\" onclick=\"window.changePwd()\">Mettre à jour</button>"
      +"</div>";

    window.changePwd = async function() {
      var oldP = document.getElementById("pwd-old").value;
      var newP = document.getElementById("pwd-new").value;
      var conf = document.getElementById("pwd-confirm").value;
      if (!oldP||!newP) { toast("Remplissez tous les champs"); return; }
      if (newP !== conf) { toast("Les mots de passe ne correspondent pas"); return; }
      if (newP.length < 6) { toast("Minimum 6 caractères"); return; }
      try {
        var cred = EmailAuthProvider.credential(user.email, oldP);
        await reauthenticateWithCredential(user, cred);
        await updatePassword(user, newP);
        toast("Mot de passe mis à jour ✓");
        document.getElementById("pwd-old").value="";
        document.getElementById("pwd-new").value="";
        document.getElementById("pwd-confirm").value="";
      } catch(e) {
        if (e.code==="auth/wrong-password") toast("Mot de passe actuel incorrect");
        else toast("Erreur: "+e.message);
      }
    };

  } catch(e) { console.error(e); toast("Erreur chargement profil"); }
});
</script>
</body>
</html>
